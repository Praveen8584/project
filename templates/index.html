<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .main-box {
            max-width: 500px;
            margin: 60px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .top-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .heading {
            margin-top: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
        }
        .heading2 {
            margin-top: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: red;
        }

        .btn-custom {
            width: 100%;
            margin-bottom: 15px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="main-box">

        <!-- Top Image -->
        <img src="/static/images/college.jpeg" alt="College Image" class="top-image">

        <!-- Heading -->
        <h3 class="heading">179,GOVERNMENT POLYTECHNIC ATHANI</h3>

        <!-- Buttons -->
        <a href="/login" class="btn btn-primary btn-custom">User Login</a>
        <a href="/login2" class="btn btn-dark btn-custom">Admin Login</a>

    </div>

</body>
</html>
