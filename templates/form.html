<!DOCTYPE html>
<html>
<head>
<title>Add Student</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #f4f6f9;
    }

    .form-box {
        max-width: 500px;
        margin: 60px auto;
        padding: 25px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
</style>
</head>

<body>
    

<div class="form-box">
    <a href="/logout" class="btn btn-danger float-end">Logout</a>
    <h3 class="text-center mb-3">Admission Form</h3>

    <!-- Success Message -->
    {% if success %}
    <div id="successMsg" class="alert alert-success text-center">
        Record Submit Successfully
    </div>
    {% endif %}

    <form method="POST">
        <input type="text" name="name" placeholder="Full Name" class="form-control mb-2" required>

        <input type="text" name="adhar" placeholder="Adhar Number" class="form-control mb-2" required>

        <input type="email" name="email" placeholder="Email" class="form-control mb-2" required>

        <input type="text" name="phone" placeholder="Phone" class="form-control mb-2" required>

        <select name="gender" class="form-control mb-2">
            <option>Male</option>
            <option>Female</option>
        </select>

        <select name="course" class="form-control mb-3">
            <option>Computer Science</option>
            <option>Mechanical</option>
            <option>Civil</option>
        </select>

        <button class="btn btn-success w-100">Submit</button>
    </form>

</div>

<!-- Auto Hide Script -->
<script>
    setTimeout(function() {
        var msg = document.getElementById("successMsg");
        if (msg) {
            msg.style.display = "none";
        }
    }, 3000);
</script>

</body>
</html>
