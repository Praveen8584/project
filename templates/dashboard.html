<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
<h2>Student Records</h2>

<a href="/add" class="btn btn-success">Add Student</a>
<a href="/export" class="btn btn-warning">Download Excel</a>
<a href="/logout" class="btn btn-danger float-end">Logout</a>

<table class="table table-bordered mt-3">
<tr>
<th>ID</th><th>Name</th><th>Adhar</th><th>Email</th><th>Phone</th><th>Gender</th><th>Course</th><th>Action</th>
</tr>

{% for row in data %}
<tr>
<td>{{row.id}}</td>
<td>{{row.name}}</td>
<td>{{row.adhar}}</td>
<td>{{row.email}}</td>
<td>{{row.phone}}</td>
<td>{{row.gender}}</td>
<td>{{row.course}}</td>
<td>
<a href="/edit/{{row.id}}" class="btn btn-primary btn-sm">Edit</a>
<a href="/delete/{{row.id}}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
{% endfor %}

</table>
</div>

</body>
</html>
