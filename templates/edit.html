<!DOCTYPE html>
<html>
<head>
<title>Edit Student</title>

<!-- Mobile Responsive -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #f4f6f9;
    }

    .form-box {
        max-width: 500px;
        margin: 30px auto;
        padding: 20px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    @media (max-width: 576px) {
        .form-box {
            margin: 15px;
            padding: 15px;
        }
    }
</style>

</head>
<body>

<div class="container">
    <div class="form-box">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Update Form</h5>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>

        <!-- Success Message -->
        {% if success %}
        <div id="successMsg" class="alert alert-success text-center">
            Record Submit Successfully
        </div>
        {% endif %}

        <form method="POST">

            <div class="mb-2">
                <input type="text" name="name" value="{{student.name}}" class="form-control" placeholder="Full Name" required>
            </div>

            <div class="mb-2">
                <input type="text" name="adhar" value="{{student.adhar}}" class="form-control" placeholder="Aadhar Number" required>
            </div>

            <div class="mb-2">
                <input type="email" name="email" value="{{student.email}}" class="form-control" placeholder="Email" required>
            </div>

            <div class="mb-2">
                <input type="text" name="phone" value="{{student.phone}}" class="form-control" placeholder="Phone Number" required>
            </div>

            <!-- Gender Dropdown -->
            <div class="mb-2">
                <select name="gender" class="form-select" required>
                    <option value="">Select Gender</option>
                    <option value="Male" {% if student.gender=='Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender=='Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if student.gender=='Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <!-- Course Dropdown -->
            <div class="mb-3">
                <select name="course" class="form-select" required>
                    <option value="">Select Course</option>
                    <option value="Civil Engineering" {% if student.course=='Civil Engineering' %}selected{% endif %}>Civil Engineering</option>
                    <option value="Computer Science & Engineering" {% if student.course=='Computer Science & Engineering' %}selected{% endif %}>Computer Science & Engineering</option>
                    <option value="Electronics & Communication Engineering" {% if student.course=='Electronics & Communication Engineering' %}selected{% endif %}>Electronics & Communication Engineering</option>
                    <option value="Mechanical Engineering" {% if student.course=='Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Update</button>

        </form>

    </div>
</div>

<!-- Auto Hide Script -->
<script>
    setTimeout(function() {
        var msg = document.getElementById("successMsg");
        if (msg) {
            msg.style.display = "none";
        }
    }, 3000);
</script>

</body>
</html>
