<!DOCTYPE html>
<html>
<head>
<title>Edit</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #f4f6f9;
    }

    .form-box {
        max-width: 500px;
        margin: 60px auto;
        padding: 25px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .success-msg {
        display: none;
    }
</style>

</head>
<body>

<div class="form-box">

    <h3 class="text-center mb-3">Edit Student</h3>

    <!-- Success Message -->
    {% if success %}
    <div id="successMsg" class="alert alert-success text-center">
        Record Submit Successfully
    </div>
    {% endif %}

    <form method="POST" onsubmit="showMessage()">
        <input type="text" name="name" value="{{student.name}}" class="form-control mb-2" required>
        <input type="text" name="adhar" value="{{student.adhar}}" class="form-control mb-2" required>
        <input type="email" name="email" value="{{student.email}}" class="form-control mb-2" required>
        <input type="text" name="phone" value="{{student.phone}}" class="form-control mb-2" required>

        <input type="text" name="gender" value="{{student.gender}}" class="form-control mb-2" required>
        <input type="text" name="course" value="{{student.course}}" class="form-control mb-2" required>

        <button type="submit" class="btn btn-primary w-100">Update</button>
    </form>

</div>

<!-- Auto Hide Script -->
<script>
    setTimeout(function() {
        var msg = document.getElementById("successMsg");
        if (msg) {
            msg.style.display = "none";
        }
    }, 3000);
</script>

</body>
</html>
